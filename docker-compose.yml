version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: trustcore-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trustcore
      MYSQL_USER: trustcore
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/TrustcoreDB.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustcore-backend
    restart: always
    environment:
      APP_NAME: "TrustCore Suisse"
      APP_ENV: production
      APP_KEY: "base64:3l+oO2p8wR5Q7u2Qk3gYh9Fm7yU8e1N+2r1A4b5C6D="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: trustcore
      DB_USERNAME: trustcore
      DB_PASSWORD: secretpassword
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:80"
    depends_on:
      - db

  demo:
    image: nginx:alpine
    container_name: trustcore-demo
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro

volumes:
  db_data:
