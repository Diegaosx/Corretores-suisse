  path_provider_foundation: 2.4.0
  path_provider_linux: 2.2.1
  path_provider_platform_interface: 2.1.2
  path_provider_windows: 2.3.0
  plugin_platform_interface: 2.1.8
  provider: 6.1.2
  shared_preferences: 2.3.2
  shared_preferences_android: 2.3.2
  shared_preferences_foundation: 2.5.2
  shared_preferences_linux: 2.4.1
  shared_preferences_platform_interface: 2.4.1
  shared_preferences_web: 2.4.2
  shared_preferences_windows: 2.4.1
  speech_to_text: ^7.0.0
  sqflite: 2.3.3+1
  sqflite_common: 2.5.4+3
  stop_watch_timer: 3.0.2
  stream_transform: 2.1.0
  synchronized: 3.2.0
  timeago: 3.6.1
  url_launcher: 6.3.0
  url_launcher_android: 6.3.10
  url_launcher_ios: 6.3.1
  url_launcher_linux: 3.2.0
  url_launcher_macos: 3.2.1
  url_launcher_platform_interface: 2.3.2
  url_launcher_web: 2.3.3
  url_launcher_windows: 3.1.2
  cupertino_icons: ^1.0.0
  permission_handler: ^11.3.1
  audioplayers: ^6.1.1
  firebase_auth: ^5.3.3
  fluttertoast: ^8.2.12
  get: ^4.7.2

dependency_overrides:
  http: 1.2.2
  uuid: ^4.0.0

dev_dependencies:
  flutter_lints: 4.0.0
  lints: 4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_app.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon_app.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"

flutter_native_splash:
  color: "#FFFFFF"
  android_gravity: center
  ios_content_mode: center
  image: assets/images/splash.png
